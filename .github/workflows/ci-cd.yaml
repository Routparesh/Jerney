name: 'complete ci-cd'

on:
  push:
    branches: [devops]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Frontend install
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      # Backend install
      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      # Run frontend lint
      - name: Run frontend lint
        run: npx eslint .
        working-directory: frontend

      # Run backend lint
      - name: Run backend lint
        run: npx eslint .
        working-directory: backend
  depchecktest:
    runs-on: ubuntu-latest
    needs: lint
    name: depecheck_test
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Frontend install
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      # Backend install
      - name: Install backend dependencies
        run: npm install
        working-directory: backend
      - name: Depcheck
        uses: dependency-check/Dependency-Check_Action@main
        id: Depcheck
        with:
          project: 'test'
          path: '.'
          format: 'HTML'
          out: 'reports' # this is the default, no need to specify unless you wish to override it
          args: >
            --failOnCVSS 7
            --enableRetired
      - name: Upload Test results
        uses: actions/upload-artifact@master
        with:
          name: Depcheck report
          path: ${{github.workspace}}/reports

  docker-build:
    runs-on: ubuntu-latest
    needs: depchecktest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v5 doesn't exist yet, fixed to v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Install backend dependencies
        run: |
          npm install
          npm audit fix --force
        working-directory: backend

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # BUILD ONLY — no push, load into local Docker daemon for Trivy
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true # loads image into local daemon so Trivy can scan it
          tags: |
            routparesh/jerney-frontend:latest
            routparesh/jerney-frontend:${{ github.sha }}

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            routparesh/jerney-backend:latest
            routparesh/jerney-backend:${{ github.sha }}

  trivy-scan:
    name: Trivy Scan
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Install backend dependencies
        run: |
          npm install
          npm audit fix --force
        working-directory: backend
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Rebuild with cache to get image locally (separate jobs don't share daemon)
      - name: Rebuild frontend for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: routparesh/jerney-frontend:${{ github.sha }}

      - name: Rebuild backend for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: routparesh/jerney-backend:${{ github.sha }}

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'routparesh/jerney-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'routparesh/jerney-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  docker-push:
    name: Push to Docker Hub
    needs: trivy-scan # only runs if trivy-scan passes (exit-code: 1 on failure)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            routparesh/jerney-frontend:latest
            routparesh/jerney-frontend:${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            routparesh/jerney-backend:latest
            routparesh/jerney-backend:${{ github.sha }}
